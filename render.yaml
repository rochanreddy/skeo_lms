# Render Blueprint for the Skeo LMS API.
#
# Modelled on menler-lms/render.yaml, which is where the reasoning behind most
# of these choices was worked out. The two differences worth knowing:
#
#   * No persistent disk. The only upload path here is the programme importer,
#     and it uses multer.memoryStorage() with a 15 MB cap (routes/programs.js),
#     so nothing is ever written to the filesystem. Render's ephemeral disk is
#     therefore not a problem — do NOT add one "to be safe"; it costs money and
#     pins the service to a single instance.
#
#   * Mail does not work here yet. See the SMTP note at the foot of this file
#     before relying on anything that sends email.
#
# The client (client/, Vite + React) is not described here — it is static and
# belongs on Vercel next to the marketing site.
services:
  - type: web
    name: skeo-lms
    runtime: node
    # Singapore for the same reason menler-lms is: the Atlas cluster and the
    # students are both in India. A US region puts ~335ms on the wire for every
    # call, and Render cannot move a service between regions after creation —
    # this is the one setting here that is genuinely irreversible.
    region: singapore
    # Free while this is being stood up, because a card is the one thing that
    # should not stand between a repo and its first deploy.
    #
    # Know what it costs, though: a free instance sleeps after 15 minutes idle
    # and takes ~50s to wake. That wake lands on whoever opens the app first
    # each morning, and on a cohort that has paid for the course it will read
    # as the site being broken. Move to `starter` before students are let in —
    # it is a one-line change here, or a click in the dashboard.
    plan: free
    branch: main
    # Two independent npm projects live in this repo; only server/ is deployed.
    rootDir: server
    # `npm ci` not `npm install` — the lockfile is the point of a reproducible
    # deploy. @node-rs/bcrypt is a native module and resolves to a prebuilt
    # linux-x64 binary here; no build toolchain is needed for it.
    buildCommand: npm ci
    startCommand: npm start
    # index.js awaits connectDb() before app.listen(), so the port does not open
    # until Atlas is connected. That makes a plain 200 from /health an honest
    # readiness signal, and it is what holds traffic off a deploy that cannot
    # reach the database.
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Read twice over: index.js splits it into the CORS allowlist, and the
      # mailer puts it in login and password-reset links. Get it wrong and every
      # browser call from the app is refused by CORS, which looks like the API
      # being down rather than like a misconfigured origin.
      #
      # Set this to wherever the LMS client actually ends up. The value below
      # assumes it lands at lms.skeoai.com; add the Vercel preview origin too if
      # you want previews to be able to call production.
      - key: SKEO_APP_URL
        value: https://lms.skeoai.com

      # sync:false = Render prompts for the value on first deploy rather than
      # storing it in git. None of these may be committed.
      #
      # MONGODB_URI: the same Atlas cluster as the marketing site, but this app
      # writes skeo_* collections. Use a database user scoped to what it needs.
      #
      # JWT_SECRET: changing it later logs every user out at once, because every
      # token and device-session row in flight is signed with the old value.
      # Generate it once, keep it, and do not reuse menler-lms's.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

      # Video and document integrations. Both are optional — the app starts
      # without them and the features that need them fail closed rather than
      # taking the process down.
      - key: VDOCIPHER_API_SECRET
        sync: false
      - key: VDOCIPHER_WATERMARK
        sync: false
      - key: GOOGLE_DRIVE_API_KEY
        sync: false

      # ---------------------------------------------------------------------
      # MAIL
      #
      # Resend, not SMTP. Render firewalls outbound 25/465/587, and the
      # failure is not an auth error you would notice: the connection hangs
      # until it times out and takes the request with it. Correct SMTP
      # credentials do not help. Resend goes out over 443, which is never
      # blocked. utils/email.js tries Resend, then SMTP, then the console.
      #
      # MAIL_FROM must be on a domain verified in the Resend dashboard. Leave
      # it unset and the fallback is onboarding@resend.dev, which only
      # delivers to the Resend account owner's own address — it looks like it
      # works in testing and reaches nobody in production.
      #
      #   MAIL_FROM = Skeo <noreply@your-verified-domain>
      #
      # SMTP_* are deliberately absent. They are still read as a fallback, so
      # they work on a host that allows SMTP, but setting them here would only
      # produce the hang described above.
      # ---------------------------------------------------------------------
      # ZeptoMail is tried before Resend (utils/email.js). Every paid website
      # order sends a login mail, and Resend's free 100 a day is not a ceiling a
      # checkout can hit. MAIL_FROM must then be on a domain verified in
      # ZeptoMail: skeo <noreply@skeoai.com> needs skeoai.com added there.
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      # The shared secret skeoai.com's server sends to POST /api/skeo/provision
      # after Cashfree confirms a payment. The SAME value is set on the website
      # (Vercel) as SKEO_PROVISION_SECRET. At least 32 characters, or the route
      # refuses everything — an endpoint that hands out accounts must not be
      # open because someone forgot to set it.
      - key: PROVISION_SECRET
        sync: false
      # Deliberately absent:
      #   PORT            — Render injects it; index.js reads process.env.PORT
      #                     and only falls back to 4200 for local dev. Setting
      #                     it here fights the platform's port detection.
      #   SKEO_SEED_EMAIL — read only by scripts/seed.js, never by the running
      #   SKEO_SEED_PASSWORD  server. They belong on your laptop, not the host.
